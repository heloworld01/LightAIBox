<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  对话页的内嵌渲染容器（QWebEngineView 加载）。

  职责：
    1. 提供 #messages 容器，Python 端把「气泡 HTML」整体注入（innerHTML 替换）。
    2. 加载本地打包的 MathJax v3（tex-chtml）与 mermaid（均随 app/resources 分发，
       完全离线可用），分别渲染 LaTeX 公式与 mermaid 图。
    3. 暴露 window.__renderChat(html, _pageBg, stick, mermaidTheme)：设消息 HTML
       -> mermaid 图 -> MathJax 重排公式 -> 按 stick 贴底/还原滚动。

  页面整体透明，透出跟随 QSS 的父容器底色以消除换肤滞后；气泡配色仍由 Python 端
  经 _chat_palette() 内联注入到各气泡元素。点击 #messages 内 a[href^="chat:"]
  阻止默认跳转（由 Python 端 QWebEnginePage.acceptNavigationRequest 拦截处理）。
-->
<style>
  /* 对话页整体透明：不再自绘主题实色，而是透出底下跟随 QSS 的窗口/父容器底色。
     切主题时外层 Qt chrome 换 QSS 即时生效，WebView 因透明同步显出新底色，
     消掉「中间大空白区滞后一帧 / 上下分色」的问题（JS 无需再为换色重涂页面）。
     注意：Python 侧须把 QWebEnginePage.setBackgroundColor 设为 Qt.transparent，
     否则 Chromium 会在透明 DOM 之下铺默认白底；已实测透明+父色透出无白闪。 */
  html, body {
    margin: 0;
    padding: 8px;
    box-sizing: border-box;
    background-color: transparent;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  /* 保持 html 至少占满视口，使内容不满一屏时整页仍按透明渲染、滚动到底正常。 */
  html {
    min-height: 100%;
  }
  /* #messages 直接承载 Python 端生成的富文本气泡 */
  mjx-container {
    line-height: normal;
  }
  /* 消除气泡上下过大空隙：markdown 把文本包成 <p>（UA 默认 margin-block 1em），
     叠加气泡自身 padding 后，单段回答的文字与气泡顶/底之间会空出近 30px。
     这里把气泡内「首块级元素的上边距 / 末块级元素的下边距」归零——只削贴边那道，
     中段之间的间距保持不变，故多段落仍正常分隔。通配 * 以同时覆盖标题、列表、
     代码块、表格、引用等所有块级首尾项。 */
  #messages .bubble > *:first-child { margin-top: 0 !important; }
  #messages .bubble > *:last-child  { margin-bottom: 0 !important; }

  /* 细滚动条：对话滚动条是 Chromium 绘制的文档滚动条，不随 Qt qss；这里用
     ::-webkit-scrollbar 收窄（默认 ~15px → 6px）。页面底色透明，轨道留空、
     拇指用半透明灰，在亮/暗主题下都适看。 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, 0.45);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, 0.65); }

  /* 流式打字光标：生成中在流式气泡末尾闪烁，提示正在进行 */
  .stream-cursor {
    display: inline-block;
    width: 0.55em;
    height: 1.1em;
    vertical-align: text-bottom;
    margin-left: 2px;
    background: currentColor;
    border-radius: 1px;
    opacity: 0.9;
    animation: stream-blink 0.9s step-start infinite;
  }
  @keyframes stream-blink {
    0%, 50% { opacity: 0.9; }
    50.01%, 100% { opacity: 0.15; }
  }
</style>
<script>
  // MathJax v3 初始化配置必须在加载 tex-chtml.js 之前生效
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)'], ['$', '$']],
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      processEscapes: true,
      packages: ['base', 'ams', 'autoload', 'newcommand',
                 'configmacros', 'require', 'color']
    },
    options: {
      // 代码块 / 原文标签内的文字不当作公式扫描
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea',
                     'pre', 'code', 'annotation', 'annotation-xml'],
      processHtmlClass: 'tex2jax_process',
      ignoreHtmlClass: 'no-mathjax'
    },
    chtml: {
      scale: 1.0
    }
  };
</script>
<script src="vendor/mathjax/tex-chtml.js" id="MathJax-script" async></script>
<script src="vendor/mermaid/mermaid.min.js"></script>
<script>
  // MathJax 尚未就绪时的会话内排队：先注入 HTML，等 MathJax ready 后再重排。
  window.__mathJaxReady = new Promise(function (resolve) {
    window.__resolveMathJaxReady = resolve;
  });
  document.addEventListener('DOMContentLoaded', function () {
    var check = setInterval(function () {
      if (window.MathJax && window.MathJax.typesetPromise) {
        clearInterval(check);
        window.__resolveMathJaxReady();
      }
    }, 30);
  });

  // mermaid 尚未就绪时的会话内排队。mermaid.min.js 是同步 UMD，加载后即有
  // window.mermaid.run；此处轮询兜底，避免竞态。
  window.__mermaidReady = new Promise(function (resolve) {
    window.__resolveMermaidReady = resolve;
  });
  (function pollMermaid() {
    if (window.mermaid && window.mermaid.run) {
      window.__resolveMermaidReady();
    } else {
      setTimeout(pollMermaid, 30);
    }
  })();

  // 渲染消息区内的 .mermaid 块（Python 端把 ```mermaid 围栏包成
  // <pre class="mermaid">）。theme 由 Python 端按当前主题传入（'default'/'dark'），
  // 使 mermaid 的 SVG 配色与界面一致。startOnLoad 关掉，避免它监听 DOM 自动跑，
  // 统一由 __renderChat 在每次 innerHTML 替换后手动 run。
  function _runMermaid(theme) {
    return window.__mermaidReady.then(function () {
      var nodes = document.querySelectorAll('#messages pre.mermaid');
      if (!nodes.length) return;
      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: theme || 'default' });
        return mermaid.run({ nodes: nodes });
      } catch (e) { console.warn('mermaid', e); }
    }).catch(function (e) { console.warn('mermaid', e); });
  }

  function _scrollBottom() {
    window.scrollTo(0, document.body.scrollHeight);
  }

  // 记录滚动位置：innerHTML 整体替换会把 scrollTop 重置为 0，MathJax 异步重排又
  // 会改变内容高度。原地重绘（换肤 / 原文切换）需要「看起来没动」，故先记当前占
  // 文档比例，重建后按同比例还原——即便重排后 scrollHeight 变化也尽量贴近原位。
  function _saveScrollRatio() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    return max > 0 ? window.scrollY / max : 0;
  }
  function _restoreScrollRatio(ratio) {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo(0, Math.max(0, ratio * max));
  }

  // 是否「贴在底部」：流式追加新内容时，只有用户本来就在底部才自动跟贴；一旦
  // 用户向上滚动查阅，就暂停自动跟贴，避免被逐个 token 拽回底部。滚回底部附近
  // 即自动恢复跟贴。阈值 _PIN_H 内视为贴底（内容不满一屏时恒贴底）。
  var _PIN_H = 4;
  var _pinned = true;
  function _updatePinned() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    _pinned = (max <= 0) || (window.scrollY >= max - _PIN_H);
  }
  window.addEventListener('scroll', _updatePinned, { passive: true });

  // 供 Python 端调用：整体替换消息区 HTML 并渲染 mermaid + MathJax。
  //   html      ：气泡整段 HTML
  //   _pageBg   ：已废弃（页面改透明），保留位参兼容旧调用
  //   stick     ：true/省略 -> 追加渲染（是否贴底再按 _pinned 决定）
  //               false     -> 保持原滚动位置（换肤、原文/渲染切换等原地重绘用）
  //   mermaidTheme：'default'（亮）/ 'dark'（暗），Python 按当前主题传入
  //   forcePin  ：用户主动发送新消息时为 true，强制贴底并复位 _pinned
  window.__renderChat = function (html, _pageBg, stick, mermaidTheme, forcePin) {
    var el = document.getElementById('messages');
    if (forcePin) { _pinned = true; }
    // 追加渲染：仅当用户已在底部时才跟贴；否则保留当前绝对滚动位置（阅读中的
    // 文本不随下方内容增长而下移）。原地重绘(stick=false)则按比例还原。
    var followBottom = stick !== false && _pinned;
    var savedY = followBottom ? 0 : window.scrollY;
    el.innerHTML = html;
    // 先跑 mermaid（把 pre.mermaid → SVG，会改变布局），再让 MathJax 重排公式
    //（skipHtmlTags 里的 pre/code 不会吃掉公式；mermaid 已先转成 svg）。两者都
    // 完成后统一按 followBottom 决定贴底或还原滚动位置，避免重排过程中反复跳动。
    window.__mermaidReady
      .then(function () { return _runMermaid(mermaidTheme); })
      .then(function () { return window.__mathJaxReady; })
      .then(function () { return MathJax.typesetPromise([el]); })
      .then(function () {
        if (followBottom) {
          _scrollBottom();
        } else {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          window.scrollTo(0, Math.min(savedY, Math.max(0, max)));
        }
      })
      .catch(function () {
        if (followBottom) {
          _scrollBottom();
        } else {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          window.scrollTo(0, Math.min(savedY, Math.max(0, max)));
        }
      });
  };

  // ------------------------------------------------------------------
  // 流式增量渲染：只更新「正在生成的最后一条助手气泡」，历史消息不再每次重建，
  // 数学公式 / mermaid 也只对该气泡重排（避免长会话每次 token 全量重排卡顿）。
  // ------------------------------------------------------------------
  var STREAM_ID = 'stream-bubble';

  // 仅对给定节点内的 .mermaid 块渲染（区别于 __renderChat 的全量 _runMermaid）。
  function _runMermaidIn(node, theme) {
    return window.__mermaidReady.then(function () {
      var nodes = node.querySelectorAll('pre.mermaid');
      if (!nodes.length) return;
      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: theme || 'default' });
        return mermaid.run({ nodes: nodes });
      } catch (e) { console.warn('mermaid', e); }
    }).catch(function (e) { console.warn('mermaid', e); });
  }

  function _streamEl() {
    return document.getElementById(STREAM_ID);
  }
  function _streamEnsure() {
    var el = _streamEl();
    if (!el) {
      el = document.createElement('div');
      el.id = STREAM_ID;
      document.getElementById('messages').appendChild(el);
    }
    return el;
  }

  // 初始化：确保流式节点存在（_on_page_loaded / 首屏重放时可安全调用）。
  window.__streamInit = function () { _streamEnsure(); };

  // 开始流式：显示光标（由 append 时写入），标记正在生成。
  window.__streamStart = function () { _streamEnsure(); };

  // 追加流式气泡 HTML：只替换流式节点，仅对该节点重排 mermaid + MathJax。
  //   html          ：单条进行中助手气泡的 HTML（不含光标）
  //   mermaidTheme  ：'default' / 'dark'
  //   showCursor    ：是否在末尾追加闪烁光标
  // 返回后自动按 _pinned 贴底（生成中仅在用户贴底时跟进）。
  //
  // 渲染串行队列：__appendStreaming 每次调用只把「最新待渲染 HTML」存进 _pending、
  // 并在空闲时启动一趟渲染。这样即便 mermaid / MathJax 重排比 90~200ms 的 push 慢，
  // 也始终只有一条渲染链在跑；渲染期间的多次 push 只覆盖内容、不排队堆积，从根上
  // 避免慢渲染在微任务积压里堆成「迟到的批量重排」抖动（还能合并掉中间态，天然丢中间帧）。
  window._streamRunning = false;
  window._streamPending = null;
  window.__appendStreaming = function (html, mermaidTheme, showCursor) {
    window._streamPending = { html: html, theme: mermaidTheme, cursor: showCursor };
    if (!window._streamRunning) { _streamRun(); }
  };

  function _streamDrainAndRender(p) {
    var el = _streamEnsure();
    el.innerHTML = p.html + (p.cursor === false ? '' : '<span class="stream-cursor"></span>');
    // MathJax.typesetClear([el]) 先清掉本节点上一次已排版的标记（mjx-container /
    // 内部缓存标记），再对整节点重新排版——否则增量替换后旧的中间态公式排版会被
    // 重复处理，长公式消息在多次刷新下越滚越慢。
    return _runMermaidIn(el, p.theme)
      .then(function () { return MathJax.typesetClear([el]); })
      .then(function () { return MathJax.typesetPromise([el]); })
      .then(function () {
        if (_pinned) _scrollBottom();
      })
      .catch(function (e) { console.warn('stream render', e); });
  }

  function _streamRun() {
    if (window._streamRunning) { return; }
    window._streamRunning = true;
    var p = window._streamPending;
    window._streamPending = null;
    if (!p) { window._streamRunning = false; return; }
    _streamDrainAndRender(p).then(function () {
      window._streamRunning = false;
      // 渲染期间又有新 push：立即续跑最新内容（此时无其它渲染在跑，无需再节流）。
      if (window._streamPending) { _streamRun(); }
    });
  }

  // 结束流式：清掉待渲染队列、移除流式节点并复位贴底标志（随后 Python 会以全量
  // __renderChat 固化整段历史）。清 _streamPending 可防止 in-flight 渲染链在结束后
  // 又把残留的中间态气泡 re-create 出来。
  window.__streamStop = function () {
    window._streamPending = null;
    var el = _streamEl();
    if (el && el.parentNode) el.parentNode.removeChild(el);
  };

  // 「原文/渲染」切换链接拦截。
  //
  // QWebEngine 对自定义 scheme（chat:）的链接点击不会发起导航，因此
  // acceptNavigationRequest 收不到它；改 fragment 又属同文档导航也不经过它。
  // 这里在点击时 preventDefault，并把动作重写为「本页 file URL + ?__lightaibox__=<action>」
  // 的脚本化跨文档导航——file scheme 的导航才会可靠地经 acceptNavigationRequest
  // 送回到 Python 侧处理（返回 False 即阻断，页面不会真的跳转）。
  // 详见 chat_page.py 的 _ChatPage。
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute('href'))) {
      t = t.parentNode;
    }
    if (!t || !t.getAttribute) return;
    var href = t.getAttribute('href');
    if (typeof href !== 'string' || href.indexOf('chat:') !== 0) return;
    e.preventDefault();
    var action = href.slice('chat:'.length);          // raw:<idx> / md:<idx>
    var base = location.href.split('?')[0];           // 保留本页 file 路径（去 query）
    location.href = base + '?__lightaibox__=' + action;
  });
</script>
</head>
<body>
<div id="messages"></div>
</body>
</html>
